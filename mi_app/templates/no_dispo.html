<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema No Disponible - Películas y Series</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #0f0c20 0%, #040714 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .status-badge {
            display: inline-block;
            margin-bottom: 20px;
            padding: 6px 18px;
            border-radius: 20px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00d2ff 0%, #928dab 50%, #0072ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
            margin-bottom: 15px;
        }
        p {
            font-size: 1.1rem;
            color: #94a3b8;
            max-width: 480px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="status-badge">Estado del Sistema</div>
    <h1>EL SISTEMA NO SE ENCUENTRA DISPONIBLE</h1>
    <p>Estamos realizando tareas de mantenimiento o la plataforma se encuentra fuera de servicio en este momento.</p>

</body>
</html>
